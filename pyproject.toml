[project]
name = "MP4ADPLADDER"
version = "1.0.0"
description = "Batch-encode an x265/MP4 ABR ladder from selected sources."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12"
dependencies = [
    "customtkinter>=5.2.2",
]

[project.scripts]
MP4ADPLADDER = "mp4adpladder:main"
mp4adpladder = "mp4adpladder:main"

[build-system]
requires = ["uv_build>=0.12.7,<0.13.0"]
build-backend = "uv_build"
